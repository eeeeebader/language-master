[project]
name = "lm-nlp"
version = "0.1.0"
description = "spaCy annotation service for Language Master stories"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "spacy==3.8.5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
