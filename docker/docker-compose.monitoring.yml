# Observability stack: Prometheus (API metrics + uptime probes), Loki/Promtail (container logs),
# Grafana (one dashboard). Internal only; Grafana is published behind Traefik with the admin
# allow-list. Start together with the main stack:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.monitoring.yml up -d
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [internal]

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [internal, edge]

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [internal]

  promtail:
    image: grafana/promtail:3.5.3
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN:-localhost}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Postgres datasource (business metrics straight from the database)
      PG_HOST: ${GRAFANA_PG_HOST:-db}
      PG_PORT: ${GRAFANA_PG_PORT:-5432}
      PG_USER: ${GRAFANA_PG_USER:-postgres}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PG_DATABASE: ${GRAFANA_PG_DATABASE:-postgres}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [edge, internal, supabase]
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana.${DOMAIN}`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.tls.certresolver: le
      traefik.http.routers.grafana.middlewares: admin-allowlist@file,security-headers@file
      traefik.http.services.grafana.loadbalancer.server.port: "3000"

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
