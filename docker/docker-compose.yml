# Everything that is not Supabase. Supabase runs from infra/supabase (project lm-supabase);
# api joins its network to reach kong and db by service name.
name: lm

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

networks:
  edge:
    name: lm-edge
  internal:
    name: lm-internal
    internal: true
  supabase:
    name: lm-supabase_default
    external: true

volumes:
  letsencrypt:
  listmonk-db:

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      ADMIN_ALLOWLIST: ${ADMIN_ALLOWLIST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge, supabase]
    labels:
      # Publish Supabase Kong (API + Studio) under db.<domain>; Studio paths behind the allow-list.
      traefik.enable: "true"
      traefik.http.routers.supabase.rule: Host(`db.${DOMAIN}`)
      traefik.http.routers.supabase.entrypoints: websecure
      traefik.http.routers.supabase.service: supabase-kong
      traefik.http.routers.supabase.middlewares: ratelimit@file,security-headers@file
      traefik.http.services.supabase-kong.loadbalancer.server.url: http://kong:8000
      traefik.http.routers.supabase-studio.rule: Host(`db.${DOMAIN}`) && (PathPrefix(`/project`) || PathPrefix(`/api/platform`) || Path(`/`))
      traefik.http.routers.supabase-studio.entrypoints: websecure
      traefik.http.routers.supabase-studio.service: supabase-kong
      traefik.http.routers.supabase-studio.middlewares: admin-allowlist@file,security-headers@file
      traefik.http.routers.supabase-studio.priority: "100"
    <<: *logging

  api:
    image: ghcr.io/${GHCR_OWNER}/language-master-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      NLP_URL: ${NLP_URL:-http://nlp:8080}
      PIPER_URL: ${PIPER_URL:-http://piper:5000}
    depends_on: [nlp]
    networks: [edge, internal, supabase]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`api.${DOMAIN}`)
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.middlewares: ratelimit@file,security-headers@file,compress@file
      traefik.http.services.api.loadbalancer.server.port: "3000"
      traefik.http.routers.api-stories.rule: Host(`api.${DOMAIN}`) && PathPrefix(`/stories`)
      traefik.http.routers.api-stories.entrypoints: websecure
      traefik.http.routers.api-stories.middlewares: ratelimit-llm@file,security-headers@file
      traefik.http.routers.api-stories.service: api
      traefik.http.routers.api-stories.priority: "50"
    <<: *logging

  nlp:
    image: ghcr.io/${GHCR_OWNER}/language-master-nlp:${IMAGE_TAG:-latest}
    build:
      context: ../apps/nlp
    restart: unless-stopped
    environment:
      SPACY_MODEL: es_core_news_md
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *logging

  piper:
    # HTTP TTS server (python -m piper.http_server) for pre-rendering lecture and dictionary audio.
    image: ghcr.io/${GHCR_OWNER}/language-master-piper:${IMAGE_TAG:-latest}
    build:
      context: ./piper
      args: { PIPER_VOICE: "${PIPER_VOICE:-es_ES-davefx-medium}" }
    restart: unless-stopped
    networks: [internal]
    <<: *logging

  client:
    image: ghcr.io/${GHCR_OWNER}/language-master-client:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile.static
      args: { DIST: apps/client/dist, CONF: spa.conf }
    restart: unless-stopped
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.client.rule: Host(`app.${DOMAIN}`)
      traefik.http.routers.client.entrypoints: websecure
      traefik.http.routers.client.middlewares: security-headers@file,compress@file
      traefik.http.services.client.loadbalancer.server.port: "80"
    <<: *logging

  admin:
    image: ghcr.io/${GHCR_OWNER}/language-master-admin:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile.static
      args: { DIST: apps/admin/dist, CONF: spa.conf }
    restart: unless-stopped
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.admin.rule: Host(`admin.${DOMAIN}`)
      traefik.http.routers.admin.entrypoints: websecure
      traefik.http.routers.admin.middlewares: admin-allowlist@file,security-headers@file,compress@file
      traefik.http.services.admin.loadbalancer.server.port: "80"
    <<: *logging

  site:
    # Astro marketing site at the root plus VitePress docs under /docs
    image: ghcr.io/${GHCR_OWNER}/language-master-site:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile.static
      args: { DIST: apps/site/dist, CONF: static.conf }
    restart: unless-stopped
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.site.rule: Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`) || Host(`docs.${DOMAIN}`)
      traefik.http.routers.site.entrypoints: websecure
      traefik.http.routers.site.middlewares: security-headers@file,compress@file
      traefik.http.services.site.loadbalancer.server.port: "80"
    <<: *logging

  listmonk:
    image: listmonk/listmonk:v5.0.3
    profiles: [v2]
    restart: unless-stopped
    command: [sh, -c, "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD}
    depends_on: [listmonk-db]
    networks: [edge, internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.listmonk.rule: Host(`news.${DOMAIN}`)
      traefik.http.routers.listmonk.entrypoints: websecure
      traefik.http.routers.listmonk.middlewares: ratelimit@file,security-headers@file
      traefik.http.services.listmonk.loadbalancer.server.port: "9000"
    <<: *logging

  listmonk-db:
    image: postgres:17-alpine
    profiles: [v2]
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD}
      POSTGRES_DB: listmonk
    volumes:
      - listmonk-db:/var/lib/postgresql/data
    networks: [internal]
    <<: *logging
