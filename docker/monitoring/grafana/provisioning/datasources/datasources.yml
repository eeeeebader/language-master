apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
  - name: Postgres
    uid: postgres
    type: postgres
    url: ${PG_HOST}:${PG_PORT}
    user: ${PG_USER}
    secureJsonData:
      password: ${PG_PASSWORD}
    jsonData:
      database: ${PG_DATABASE}
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
