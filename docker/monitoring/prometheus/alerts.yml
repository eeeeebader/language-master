groups:
  - name: language-master
    rules:
      - alert: ApiDown
        expr: probe_success{job="blackbox_http", instance=~".*/health"} == 0
        for: 3m
        labels: { severity: critical }
        annotations: { summary: "API health probe failing for 3 minutes" }
      - alert: AppShellDown
        expr: probe_success{job="blackbox_http", instance!~".*/health"} == 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Web app or admin shell not reachable" }
      - alert: StoryFailureRateHigh
        expr: |
          sum(rate(lm_story_generations_total{result=~"failed|error"}[1h]))
            / clamp_min(sum(rate(lm_story_generations_total{result=~"ok|failed|error"}[1h])), 0.0001) > 0.2
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "More than 20 % of story generations fail" }
      - alert: SyncPushSlow
        expr: histogram_quantile(0.95, sum(rate(lm_sync_push_duration_seconds_bucket[10m])) by (le)) > 2
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "p95 sync push above 2 s" }
