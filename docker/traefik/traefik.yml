# Static Traefik v3 configuration. Dynamic config (middlewares) lives in dynamic.yml.
api:
  dashboard: false
  insecure: false
log:
  level: INFO
accessLog: {}
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
providers:
  docker:
    exposedByDefault: false
    network: lm-edge
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
